name: Golem Autonomous Action Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '20 */4 * * *'

permissions:
  contents: write

jobs:
  run-golem:
    runs-on: ubuntu-latest
    steps:
      # 1. KÉO CODE BẰNG LINUX SHELL GỐC
      - name: Kéo mã nguồn Golem
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 2. HẠ TẦNG CI/CD MỚI NHẤT: SETUP-PYTHON V7 & PYTHON 3.14
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. VẬN HÀNH THỐNG LĨNH TÁC TỬ KERNEL.PY
      - name: Vận hành Tác Tử Golem
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      # 4. LƯU VẾT TÍCH HÀNH ĐỘNG VÀO GIT BỌC THÉP (FAST-FORWARD, CHỐNG LỖI 128)
      - name: Lưu vết tích tác tử vào Git
        run: |
          git config --global user.name "Golem-Action-Bot"
          git config --global user.email "bot@golem.agent"
          
          # Cấp token an toàn cho chính repo này
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          # Stage an toàn tất cả các thư mục
          for d in cortex_agent actuators organs synapses; do
            [ -d "$d" ] && git add -A "$d"
          done
          git add contract.json synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🦾 [Golem Agent] Chấp hành chỉ thị tác tử & Khế ước EMETH #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Tác tử tĩnh lặng, không có biến thiên mới."
          fi
